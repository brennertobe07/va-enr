<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Virginia Election Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: sticky header + statewide strip, four tabs (Congress / Senate / Amendments / Local),
   results cards above a sortable locality table; locality drill-down opens in a right drawer.
   DPVA dark theme (shared with absentee / cure / ENR April) — single committed dark look. */
:root {
  color-scheme: dark;
  --bg:        #0f1117;
  --surface:   #1a1d27;
  --surface2:  #20243a;
  --border:    #2a2d3a;
  --border2:   #353a50;
  --text:      #e8eaf0;
  --muted:     #8890a8;
  --accent:    #3a8fd4;
  --accent-bg: rgba(58,143,212,.12);
  /* party / option colors */
  --dem:       #3d82d4;
  --rep:       #d24a3c;
  --oth:       #9a83c9;
  --wi:        #596079;
  --np:        #6f9fbf;
  /* status */
  --green:     #2fb36b;
  --amber:     #f0a500;
  --radius:    6px;
  --font:      'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:      'DM Mono', ui-monospace, Consolas, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }
body { min-height: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ── Header ─────────────────────────────── */
#top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); }
#hdr { display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
#hdr h1 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; min-width: 220px; }
#hdr h1 span { color: var(--accent); }
#hdr .meta { display: flex; gap: 14px; font-size: 12px; color: var(--muted); font-family: var(--mono); flex-wrap: wrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; margin-right: 5px; animation: pulse 2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
#mock { background: var(--amber); color: #15161c; font-weight: 600; font-size: 12.5px; text-align: center; padding-block: 5px; }

/* ── Statewide strip ────────────────────── */
#strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--border); border-top: 1px solid var(--border); }
#strip .k { background: var(--surface); padding: 8px 14px 9px; min-width: 0; }
#strip .k .l { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
#strip .k .v { font-size: 17px; font-weight: 600; margin-top: 2px; white-space: nowrap; }
#strip .k .s { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.prog { height: 4px; background: var(--border2); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }

/* ── Tabs ───────────────────────────────── */
#tabs { display: flex; gap: 2px; border-top: 1px solid var(--border); overflow-x: auto; }
#tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px 9px; color: var(--muted); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
#tabs button:hover { color: var(--text); }
#tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
#tabs .count { font-family: var(--mono); font-weight: 400; font-size: 11px; color: var(--muted); margin-left: 6px; }

main { padding-block: 18px 40px; display: flex; flex-direction: column; gap: 18px; max-width: 1400px; margin: 0 auto; }
h2 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* ── Cards & results ─────────────────────── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
.card.sel { border-color: var(--accent); }
.card h3 { margin: 0; font-size: 15px; font-weight: 600; text-wrap: balance; }
.card .sub { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; gap: 10px; flex-wrap: wrap; }
.grid-sw { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 860px) { .grid-sw { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

.res { display: flex; flex-direction: column; gap: 9px; margin-top: 12px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 12px; align-items: baseline; }
.row .nm { font-size: 13.5px; font-weight: 500; overflow-wrap: anywhere; }
.row.lead .nm { font-weight: 700; }
.row .pt { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; color: var(--muted); margin-left: 6px; }
.row .vt { font-size: 12.5px; color: var(--muted); text-align: right; }
.row .pc { font-size: 14px; font-weight: 600; text-align: right; min-width: 52px; }
.row .bar { grid-column: 1 / -1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.row .bar i { display: block; height: 100%; border-radius: 0 4px 4px 0; }
.big .row .nm { font-size: 16px; }
.big .row .pc { font-size: 20px; }
.big .row .bar { height: 12px; }
.margin { font-size: 12px; margin-top: 10px; color: var(--muted); }
.margin b { color: var(--text); font-weight: 600; }

/* split bar (Yes/No, D/R tiles) */
.split { display: flex; height: 10px; border-radius: 3px; overflow: hidden; gap: 2px; background: var(--surface2); margin-top: 8px; }
.split i { display: block; height: 100%; }
.split-lab { display: flex; justify-content: space-between; font-size: 12px; margin-top: 5px; gap: 8px; }

.split.mid { position: relative; }
.split.mid::after { content: ""; position: absolute; left: calc(50% - 1px); top: 0; bottom: 0; width: 2px; background: var(--bg); }

/* ── Congress tree: CD › locality › precinct, expanded in place ── */
#crumb { position: sticky; top: var(--top-h, 0px); z-index: 15; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; padding-block: 8px; border-bottom: 1px solid var(--border); }
.trail { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; min-width: 0; font-size: 13px; }
.trail button { background: none; border: 0; padding: 4px 6px; border-radius: 4px; cursor: pointer; color: var(--accent); font-weight: 600; }
.trail button:last-child { color: var(--text); }
.trail button:hover { background: var(--surface2); }
.trail .sep { color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--border2); border-radius: var(--radius); overflow: hidden; flex-shrink: 0; }
.seg button { background: none; border: 0; padding: 6px 12px; font-size: 12.5px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border2); }
.seg button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); }
.seg .num { font-weight: 400; font-size: 11.5px; }
/* compare-to segmented bar: full names on desktop, two-line name/year on phones so all five fit */
.cmpbar { flex-basis: 100%; display: flex; align-items: center; gap: 8px; }
.cmpbar .l { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); white-space: nowrap; }
.cmpseg { flex: 1; max-width: 620px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border: 1px solid var(--border2); border-radius: var(--radius); overflow: hidden; }
.cmpseg button { background: none; border: 0; padding: 6px 4px; font-size: 12.5px; color: var(--muted); cursor: pointer; white-space: nowrap; min-width: 0; }
.cmpseg button + button { border-left: 1px solid var(--border2); }
.cmpseg button:hover { color: var(--text); background: var(--surface2); }
.cmpseg button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.cmpseg .sm, .cmpbar .l .sm { display: none; }
@media (max-width: 760px) {
  .cmpseg .lg, .cmpbar .l .lg { display: none; }
  .cmpbar .l .sm { display: inline; text-transform: none; font-size: 12px; letter-spacing: 0; }
  .cmpseg .sm { display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
  .cmpseg .sm small { font-size: 10.5px; font-weight: 400; opacity: .8; }
}
/* yardstick: one slim scale inside an open CD / the Senate summary — Tonight labeled above, selected comparison below */
.yard { padding: 22px 8px 22px; }
.ytrack { position: relative; height: 6px; border-radius: 3px; background: linear-gradient(90deg, rgba(210,74,60,.45), var(--border2) 50%, rgba(61,130,212,.45)); }
.ytrack i { position: absolute; top: 50%; transform: translate(-50%, -50%); border-radius: 50%; font-style: normal; }
.ytrack .tk { width: 9px; height: 9px; background: var(--muted); border: 2px solid var(--surface); }
.ytrack .tk.on { background: var(--accent); width: 12px; height: 12px; z-index: 1; }
.ytrack .now { width: 16px; height: 16px; background: var(--text); border: 3px solid var(--dem); z-index: 2; }
.ytrack .fifty { width: 2px; height: 16px; border-radius: 0; background: var(--text); opacity: .5; }
.ytrack [data-l]::after { content: attr(data-l); position: absolute; left: 50%; transform: translateX(-50%); font-size: 11px; white-space: nowrap; font-family: var(--mono); }
.ytrack .now::after { bottom: 15px; font-weight: 700; color: var(--text); }
.ytrack .tk.on::after { top: 13px; font-weight: 600; color: var(--accent); }
.ytrack .al::after { left: -4px; transform: none; }
.ytrack .ar::after { left: auto; right: -4px; transform: none; }
.nb.sen-top { padding: 14px; }
@media (max-width: 760px) { .nb.sen-top { padding: 12px 10px; } }
#crumb .ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree { display: flex; flex-direction: column; gap: 10px; }
.cdn { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.cdn.open { border-color: var(--accent); }
.nh { width: 100%; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 3px 10px; align-items: baseline; background: none; border: 0; text-align: left; padding: 12px 14px; cursor: pointer; border-radius: var(--radius); scroll-margin-top: calc(var(--top-h, 0px) + 52px); }
.nh:hover { background: var(--surface2); }
.nh .chev { width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); align-self: center; justify-self: center; transition: transform .15s; }
.nh[aria-expanded="true"] .chev { transform: rotate(45deg); border-color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .nh .chev { transition: none; } }
.nh .ttl { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nh .rt { font-size: 13.5px; font-weight: 700; text-align: right; white-space: nowrap; }
.nh .split, .nh .s2 { grid-column: 2 / -1; }
.nh .split { margin-top: 5px; }
.nh .s2 { font-size: 12px; color: var(--muted); display: flex; gap: 4px 12px; flex-wrap: wrap; align-items: center; margin-top: 3px; }
.tgt { color: var(--amber); margin-left: 2px; }
.lb .up { align-self: flex-start; }
.nb { padding: 0 14px 14px 40px; display: flex; flex-direction: column; gap: 12px; }
.nb .res { margin-top: 0; }
.nb .kv > div { background: var(--surface2); }
details.vm summary { cursor: pointer; font-size: 12px; color: var(--muted); font-weight: 600; }
.lhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.locs > li + li { border-top: 1px solid var(--border); }
.locs .nh { padding: 10px 6px; }
.locs .nh .ttl { font-size: 14px; font-weight: 600; }
.locs .nh .rt { font-size: 12.5px; }
.lb { margin: 0 0 12px 13px; padding-left: 14px; border-left: 2px solid var(--border2); display: flex; flex-direction: column; gap: 10px; }
.ptbl td:first-child { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.ptbl tr.out td { color: var(--muted); }
.ptbl td.lead { font-weight: 700; }
@media (max-width: 760px) {
  #top { position: static; }
  .nh { padding: 11px 10px; }
  .nb { padding: 0 10px 12px 10px; }
  .lb { margin-left: 4px; padding-left: 8px; }
  .ptbl th, .ptbl td { padding: 6px 6px; }
  .ptbl td:first-child { max-width: 118px; }
  .ptbl .wide { display: none; }
  .seg .num { display: none; }
  #tabs button { padding-inline: 10px; }
  #tabs .count { display: none; }
}

/* party tags & status chips */
.tag { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 3px; letter-spacing: .03em; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 2px 7px; border-radius: 10px; border: 1px solid var(--border2); white-space: nowrap; color: var(--muted); }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.st-not-reported   { color: var(--muted); }
.chip.st-in-person-only { color: #e0b44f; border-color: rgba(224,180,79,.35); }
.chip.st-mailed-only    { color: #d79a5c; border-color: rgba(215,154,92,.35); }
.chip.st-all-reported   { color: var(--accent); border-color: rgba(58,143,212,.4); }
.chip.st-final          { color: var(--green); border-color: rgba(47,179,107,.4); }

/* ── Tables ─────────────────────────────── */
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input[type="search"], select { background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text); padding: 6px 10px; font: inherit; font-size: 12.5px; min-width: 0; }
input[type="search"] { width: 220px; max-width: 100%; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; background: var(--surface); position: sticky; top: 0; cursor: pointer; user-select: none; }
th[aria-sort] { color: var(--text); }
th[aria-sort="ascending"]::after { content: " ▲"; font-size: 8px; }
th[aria-sort="descending"]::after { content: " ▼"; font-size: 8px; }
tbody tr { cursor: pointer; }
table.nolink tbody tr { cursor: default; }
tbody tr:hover td { background: var(--surface2); }
td.c { text-align: center; }
td .lead { font-weight: 600; }
.mini { display: inline-block; width: 64px; height: 6px; background: var(--surface2); border-radius: 3px; vertical-align: middle; margin-right: 6px; overflow: hidden; }
.mini i { display: block; height: 100%; background: var(--accent); }
.dlt.pos { color: #7fb2ea; }
.dlt.neg { color: #e88a7f; }

/* ── Local tab ──────────────────────────── */
.local { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 760px) { .local { grid-template-columns: minmax(0, 1fr); } }
.loclist { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; max-height: 70vh; min-width: 0; }
.loclist .h { padding: 10px; border-bottom: 1px solid var(--border); }
.loclist .h input { width: 100%; }
.loclist ul { list-style: none; margin: 0; padding: 4px 0; overflow-y: auto; }
.loclist li button { width: 100%; text-align: left; background: none; border: 0; padding: 7px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; }
.loclist li button:hover { background: var(--surface2); }
.loclist li button[aria-current="true"] { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.loclist li .n { font-family: var(--mono); color: var(--muted); font-size: 11px; }
@media (max-width: 760px) { .loclist { max-height: 260px; } }
.contest-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 12px; }
.card .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 8px; flex-wrap: wrap; }
.btn { background: transparent; border: 1px solid var(--border2); border-radius: var(--radius); padding: 5px 10px; font-size: 12px; cursor: pointer; color: var(--text); }
.btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── Drawer ─────────────────────────────── */
#scrim { position: fixed; inset: 0; background: rgba(5,6,10,.55); z-index: 40; }
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--bg); border-left: 1px solid var(--border2); z-index: 41; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
#drawer .dh { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
#drawer .dh h3 { margin: 0; font-size: 17px; }
#drawer .dh .x { margin-left: auto; background: none; border: 1px solid var(--border2); border-radius: var(--radius); width: 32px; height: 32px; cursor: pointer; font-size: 16px; flex-shrink: 0; }
#drawer .db { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.kv > div { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; }
.kv > div > .l { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.kv > div > .v { font-size: 15px; font-weight: 600; margin-top: 2px; }
.note { font-size: 12px; color: var(--muted); }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.warn { border: 1px solid rgba(240,165,0,.45); background: rgba(240,165,0,.09); color: #f3c766; border-radius: var(--radius); padding: 9px 12px; font-size: 12.5px; line-height: 1.45; }
.warn b { color: var(--amber); }
tr.cap td { background: rgba(240,165,0,.06); }
[hidden] { display: none !important; }
</style>
</head>
<body>

<div id="top">
  <div id="mock" class="wrap" hidden>Mock data: synthetic votes for layout review, not real results</div>
  <div id="hdr" class="wrap">
    <h1>Virginia <span>Election Results</span> · November 3, 2026 General</h1>
    <div class="meta"><span><i class="dot"></i>Updated <b id="m-upd">—</b></span><span>ENR <b id="m-enr">—</b></span><span>Refresh in <b id="m-cd">60</b>s</span><a href="archive/2026-04-referendum/" style="color:var(--muted)">April 2026 referendum →</a></div>
  </div>
  <div id="strip"></div>
  <nav id="tabs" class="wrap" role="tablist" aria-label="Result views">
    <button role="tab" id="tab-congress" data-tab="congress" aria-selected="true">Congress<span class="count">CD 1–11</span></button>
    <button role="tab" id="tab-senate" data-tab="senate" aria-selected="false">Senate</button>
    <button role="tab" id="tab-amendments" data-tab="amendments" aria-selected="false">Amendments</button>
    <button role="tab" id="tab-local" data-tab="local" aria-selected="false">Local<span class="count" id="local-count"></span></button>
  </nav>
</div>

<main class="wrap" id="view"></main>

<div id="scrim" hidden></div>
<aside id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="d-title">
  <div class="dh">
    <div style="min-width:0">
      <h3 id="d-title">—</h3>
      <div class="sub" id="d-sub" style="font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center"></div>
    </div>
    <button class="x" id="d-close" aria-label="Close">✕</button>
  </div>
  <div class="db" id="d-body"></div>
</aside>

<script>
"use strict";
const DATA = "data/";
const REFRESH_S = 60;
const GROUPS = [["ev", "Early"], ["ed", "Election Day"], ["mail", "Mail"], ["prov", "Provisional"], ["post", "Post-Election"]];
const AB_LABEL = { "not-reported": "Absentee not in", "in-person-only": "Early in", "mailed-only": "Mail in", "all-reported": "Absentee in", "final": "Final" };
const ORD = ["", "1st", "2nd", "3rd", "4th", "5th", "6th", "7th", "8th", "9th", "10th", "11th"];

const TARGETS = [1, 2, 5];   // CDs shown by the Congress "Targets" toggle
// "Compare to" options: [label, share index, weight index] into baseline.json records
// [exp26, base26, gov25, top25, pres24, top24, hse24, hse22, top22] (two-party Dem %, built by build_baseline.py from NCEC precinct data)
// [label, share index, weight index, phone label, phone year]
const CMP = { base: ["Baseline", 1, 0, "Base", "'26"], gov25: ["Spanberger '25", 2, 3, "Span", "'25"], pres24: ["Harris '24", 4, 5, "Harris", "'24"],
              hse24: ["House '24", 6, 5, "House", "'24"], hse22: ["House '22", 7, 8, "House", "'22"] };
let targetsPref = true, cmpPref = "base";
try { targetsPref = localStorage.getItem("enr.targets") !== "0"; cmpPref = localStorage.getItem("enr.cmp") || "base"; } catch (_) {}

const S = { tab: "congress", amContest: null, open: { cd: null, fips: null }, sopen: { cd: null, fips: null }, targetsOnly: targetsPref, cmp: CMP[cmpPref] ? cmpPref : "base",
            localFips: null, sort: {}, q: {}, precCache: {}, precData: {} };
let D = null;   // { summary, contests, localities, metadata, byId, locByFips }
let BASE = null; // baseline.json: static, fetched once; comparisons show "—" if it fails

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = n => n == null ? "—" : Number(n).toLocaleString("en-US");
const fp = (n, d = 1) => n == null || isNaN(n) ? "—" : Number(n).toFixed(d) + "%";
const sum = a => a.reduce((x, y) => x + y, 0);
const title = s => s.toLowerCase().replace(/\b([a-z])/g, m => m.toUpperCase()).replace(/\bOf\b/g, "of").replace(/\bAnd\b/g, "and");

function partyKey(o) {
  if (o.name === "Yes") return "dem";
  if (o.name === "No") return "rep";
  if (o.party === "Democratic") return "dem";
  if (o.party === "Republican") return "rep";
  if (/write-?in/i.test(o.name)) return "wi";
  return o.party ? "oth" : "np";
}
const pcolor = o => `var(--${partyKey(o)})`;
function ptag(o) {
  if (!o.party) return "";
  const ab = { Democratic: "DEM", Republican: "REP", Independent: "IND", Libertarian: "LIB", Green: "GRN" }[o.party] || o.party.slice(0, 3).toUpperCase();
  return `<span class="pt">${ab}</span>`;
}
function shortName(n) {
  const p = n.replace(/"[^"]*"/g, "").replace(/,?\s+(Jr\.?|Sr\.?|II|III|IV)$/i, "").trim().split(/\s+/);
  return p[p.length - 1];
}
function contestTitle(c) {
  if (c.scope === "Congressional") return `${ORD[c.district]} District · U.S. House`;
  if (c.id === "cc142") return "U.S. Senate";
  if (c.scope === "HouseOfDelegates") return `House of Delegates · ${c.district}th District (special)`;
  const m = c.name.match(/^Proposed Constitutional Amendment Question (\d)/);
  if (m) return `Constitutional Amendment ${m[1]}`;
  return c.name;
}
const partisan = c => c.options.some(o => o.party === "Democratic") && c.options.some(o => o.party === "Republican");
const optIdx = (c, party) => c.options.findIndex(o => o.party === party);

/* ── Data ─────────────────────────────────────────────── */
async function load() {
  const t = Date.now();
  const get = f => fetch(`${DATA}${f}?t=${t}`).then(r => { if (!r.ok) throw new Error(`${f}: ${r.status}`); return r.json(); });
  const [summary, contests, localities, metadata] = await Promise.all(
    ["summary.json", "contests.json", "localities.json", "metadata.json"].map(get));
  if (!BASE) BASE = await fetch(`${DATA}baseline.json`).then(r => r.ok ? r.json() : null).catch(() => null);
  D = { summary, contests, localities, metadata,
        byId: Object.fromEntries(contests.map(c => [c.id, c])),
        locByFips: Object.fromEntries(localities.map(l => [l.fips, l])) };
  // localities split across CDs (in more than one House contest)
  const n = {};
  contests.filter(c => c.scope === "Congressional").forEach(c => c.localities.forEach(f => n[f] = (n[f] || 0) + 1));
  D.splits = new Set(Object.keys(n).filter(f => n[f] > 1));
  S.precCache = {}; S.precData = {};
  // refetch open localities' precincts (and, for the Senate tree, the split ones) before render so the tree doesn't flash "Loading"
  const need = new Set([S.open.fips, S.sopen.fips].filter(Boolean));
  if (S.tab === "senate") D.splits.forEach(f => need.add(f));
  await Promise.all([...need].map(loadPrec));
}
function loadPrec(fips) {
  return precincts(fips).then(pf => S.precData[fips] = pf, () => S.precData[fips] = { precincts: [], failed: true });
}
async function precincts(fips) {
  if (!S.precCache[fips]) {
    S.precCache[fips] = fetch(`${DATA}precincts/${fips}.json?t=${Date.now()}`).then(r => r.json());
  }
  return S.precCache[fips];
}

/* ── Shared pieces ────────────────────────────────────── */
function resultRows(c, votes, opts = {}) {
  const total = sum(votes);
  const order = c.options.map((o, i) => i).filter(i => !(opts.hideZeroWriteIn && partyKey(c.options[i]) === "wi" && votes[i] === 0));
  order.sort((a, b) => votes[b] - votes[a]);
  const lead = total ? order[0] : -1;
  return `<div class="res">` + order.map(i => {
    const o = c.options[i], p = total ? votes[i] / total * 100 : 0;
    return `<div class="row${i === lead ? " lead" : ""}">
      <div class="nm">${esc(o.name)}${ptag(o)}</div>
      <div class="vt num">${fmt(votes[i])}</div>
      <div class="pc num">${total ? p.toFixed(1) + "%" : "—"}</div>
      <div class="bar"><i style="width:${p}%;background:${pcolor(o)}"></i></div></div>`;
  }).join("") + `</div>`;
}
function marginLine(c, votes) {
  const total = sum(votes);
  if (!total) return `<div class="margin">No votes reported yet</div>`;
  const ix = votes.map((v, i) => i).sort((a, b) => votes[b] - votes[a]);
  const m = votes[ix[0]] - (ix.length > 1 ? votes[ix[1]] : 0);
  return `<div class="margin"><b>${esc(shortName(c.options[ix[0]].name))}</b> leads by <b class="num">${fmt(m)}</b> votes (${(m / total * 100).toFixed(1)} pts)</div>`;
}
const chip = st => `<span class="chip st-${st}">${AB_LABEL[st] || st}</span>`;
function reportingSub(part, rep) {
  return `<span class="num">${fmt(rep)}/${fmt(part)} precincts</span><span class="num">${fp(part ? rep / part * 100 : 0, 0)} reporting</span>`;
}

/* ── Strip ────────────────────────────────────────────── */
function renderStrip() {
  const s = D.summary;
  const counts = ["not-reported", "in-person-only", "mailed-only", "all-reported", "final"]
    .map(k => [k, s["n_" + k.replace(/-/g, "_")]]).filter(([, n]) => n);
  $("#strip").innerHTML = `
    <div class="k"><div class="l">Precincts reporting</div><div class="v num">${fp(s.pct_reporting)}</div>
      <div class="s num">${fmt(s.precincts_rep)} of ${fmt(s.precincts_part)}</div><div class="prog"><i style="width:${s.pct_reporting}%"></i></div></div>
    <div class="k"><div class="l">Votes counted</div><div class="v num">${fmt(s.total)}</div>
      <div class="s">U.S. Senate · ${fp(s.turnout_pct)} of active voters*</div></div>
    <div class="k"><div class="l">Absentee returned</div><div class="v num">${fmt(s.ab_voted)}</div>
      <div class="s">${fmt(s.ab_issued)} issued</div></div>
    <div class="k"><div class="l">Absentee not yet counted</div><div class="v num">${fmt(s.ab_outstanding)}</div>
      <div class="s num">est. <span style="color:var(--dem)">D ${fmt(s.ab_dem_outstanding)}</span> · <span style="color:var(--rep)">R ${fmt(s.ab_rep_outstanding)}</span></div></div>
    <div class="k"><div class="l">Absentee status · 133 localities</div>
      <div class="chips">${counts.map(([k, n]) => `<span class="chip st-${k}">${AB_LABEL[k]} <b class="num">${n}</b></span>`).join("")}</div>
      ${s.n_cap_pending ? `<div class="s" style="margin-top:4px">${s.n_cap_pending} still holding absentee in a central precinct</div>` : ""}</div>`;
  const m = D.metadata;
  $("#m-upd").textContent = m.last_updated || "—";
  $("#m-enr").textContent = m.enr_created_at ? new Date(m.enr_created_at).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) : "—";
  $("#mock").hidden = !m.mock;
  const nLocal = D.localities.filter(l => localContests(l).length).length;
  $("#local-count").textContent = `${nLocal} localities`;
}

/* ── Locality table (Amendments tab) ─────────────────── */
function locRows(c, cdKey) {
  const dI = optIdx(c, "Democratic"), rI = optIdx(c, "Republican");
  return D.localities.filter(l => l.contests[c.id]).map(l => {
    const lc = l.contests[c.id], tot = lc.total;
    const ix = lc.v.map((v, i) => i).sort((a, b) => lc.v[b] - lc.v[a]);
    const lead = tot ? ix[0] : -1;
    const marg = tot ? (lc.v[ix[0]] - (ix.length > 1 ? lc.v[ix[1]] : 0)) / tot * 100 : null;
    const dem = dI >= 0 && tot ? lc.v[dI] / tot * 100 : null;
    const ab = cdKey ? (l.cds[cdKey] || {}) : l;
    return {
      l, fips: l.fips, name: title(l.name), rep: lc.part ? lc.rep / lc.part * 100 : 0, part: lc.part, nrep: lc.rep,
      st: l.absentee_state, lead, marg, dem, tot,
      vsModel: dem != null && l.ncec_demperf != null && dI >= 0 && rI >= 0 ? dem - l.ncec_demperf : null,
      abOut: ab.ab_outstanding ?? null,
      turn: cdKey || !tot ? null : l.turnout_pct,
    };
  });
}
function locTable(c, key, cdKey) {
  const isP = partisan(c), isM = c.type === "BallotMeasure";
  // ballot measures lead with Yes % and margin so they're on screen on a phone
  const cols = isM ? [
    ["name", "Locality"], ["dem", "Yes %"], ["lead", "Leader"], ["marg", "Margin"], ["rep", "Reporting"],
    ["tot", "Votes"], ["st", "Absentee"], ...(cdKey ? [] : [["turn", "Turnout*"]]), ["abOut", "Abs. not counted"],
  ] : [
    ["name", "Locality"], ["rep", "Reporting"], ["st", "Absentee"], ["lead", "Leader"], ["marg", "Margin"],
    ...(isP ? [["dem", "Dem %"], ["vsModel", "vs Baseline"]] : []),
    ["tot", "Votes"], ...(cdKey ? [] : [["turn", "Turnout*"]]), ["abOut", "Abs. not counted"],
  ];
  let rows = locRows(c, cdKey);
  if (isM) rows.forEach(r => { const lc = r.l.contests[c.id]; r.dem = r.tot ? lc.v[0] / r.tot * 100 : null; });
  const q = (S.q[key] || "").toLowerCase();
  if (q) rows = rows.filter(r => r.name.toLowerCase().includes(q));
  const so = S.sort[key] || { k: "tot", d: -1 };
  rows.sort((a, b) => {
    let x = a[so.k], y = b[so.k];
    if (so.k === "lead") { x = a.lead >= 0 ? c.options[a.lead].name : ""; y = b.lead >= 0 ? c.options[b.lead].name : ""; }
    if (x == null && y == null) return a.name.localeCompare(b.name);
    if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * so.d || a.name.localeCompare(b.name);
  });
  const th = cols.map(([k, lab]) => `<th data-k="${k}" ${so.k === k ? `aria-sort="${so.d > 0 ? "ascending" : "descending"}"` : ""}>${lab}</th>`).join("");
  const td = rows.map(r => {
    const lo = r.lead >= 0 ? c.options[r.lead] : null;
    return `<tr data-fips="${r.fips}">` + cols.map(([k]) => {
      switch (k) {
        case "name": return `<td><b>${esc(r.name)}</b></td>`;
        case "rep": return `<td class="num"><span class="mini"><i style="width:${r.rep}%"></i></span>${r.nrep}/${r.part}</td>`;
        case "st": return `<td class="c">${chip(r.st)}</td>`;
        case "lead": return `<td>${lo ? `<span class="tag" style="background:${pcolor(lo)};color:#fff">${esc(isM ? lo.name : shortName(lo.name))}</span>` : "—"}</td>`;
        case "marg": return `<td class="num">${r.marg == null ? "—" : "+" + r.marg.toFixed(1)}</td>`;
        case "dem": return `<td class="num">${fp(r.dem)}</td>`;
        case "vsModel": return `<td class="num dlt ${r.vsModel > 0 ? "pos" : r.vsModel < 0 ? "neg" : ""}">${r.vsModel == null ? "—" : (r.vsModel > 0 ? "+" : "") + r.vsModel.toFixed(1)}</td>`;
        case "tot": return `<td class="num">${fmt(r.tot)}</td>`;
        case "turn": return `<td class="num">${fp(r.turn)}</td>`;
        case "abOut": return `<td class="num">${fmt(r.abOut)}</td>`;
      }
    }).join("") + `</tr>`;
  }).join("");
  return `<div class="tbl-wrap"><table data-key="${key}" data-cid="${c.id}"><thead><tr>${th}</tr></thead><tbody>${td || `<tr><td colspan="${cols.length}" class="empty">No matching localities</td></tr>`}</tbody></table></div>`;
}

/* ── Drill-down tree: CD › locality › precinct ────────── */
// One tree, two races. Congress tab: each CD's House race. Senate tab: the U.S. Senate race inside each CD.
// Every level opens in place under the row you tapped; #crumb (sticky) shows the path back up.
const TREES = {
  congress:  { st: () => S.open,  pre: "n", race: cdc => cdc,           root: () => S.targetsOnly ? "Target districts" : "All districts" },
  senate:    { st: () => S.sopen, pre: "s", race: () => D.byId.cc142,   root: () => "U.S. Senate" },
};
const tree = () => TREES[S.tab];
const redraw = () => (S.tab === "congress" ? renderCongress : renderSenate)();

function leadText(c, v) {
  const t = sum(v);
  if (!t) return `<span class="muted" style="font-weight:500">Not reported</span>`;
  const ix = v.map((x, i) => i).sort((a, b) => v[b] - v[a]);
  const o = c.options[ix[0]], m = (v[ix[0]] - (ix.length > 1 ? v[ix[1]] : 0)) / t * 100;
  return `<span class="num" style="color:${pcolor(o)}">${esc(shortName(o.name))} +${m.toFixed(1)}</span>`;
}
function dvrBar(c, v) {
  const t = sum(v), dI = optIdx(c, "Democratic"), rI = optIdx(c, "Republican");
  if (!t) return `<div class="split mid"></div>`;
  const d = dI >= 0 ? v[dI] : 0, r = rI >= 0 ? v[rI] : 0;
  return `<div class="split mid"><i style="width:${d / t * 100}%;background:var(--dem)"></i><i style="width:${(t - d - r) / t * 100}%;background:var(--oth)"></i><i style="flex:1;background:${r ? "var(--rep)" : "transparent"}"></i></div>`;
}
function matchup(c) {
  const d = c.options[optIdx(c, "Democratic")], r = c.options[optIdx(c, "Republican")];
  return d && r ? `${esc(shortName(d.name))} v. ${esc(shortName(r.name))}` : "";
}
// two-party Dem share of a vote array, and its gap vs the selected baseline record
function dem2(c, v) {
  const dI = optIdx(c, "Democratic"), rI = optIdx(c, "Republican");
  if (dI < 0 || rI < 0) return null;
  const t = v[dI] + v[rI];
  return t ? v[dI] / t * 100 : null;
}
const baseOf = rec => rec ? rec[CMP[S.cmp][1]] : null;
function vsCmp(cur, rec, long) {
  const b = baseOf(rec);
  if (cur == null || b == null) return "";
  const d = Math.round((cur - b) * 10) / 10 || 0;   // round first: no "-0.0"
  return `<span class="num dlt ${d > 0 ? "pos" : d < 0 ? "neg" : ""}">${d > 0 ? "+" : ""}${d.toFixed(1)}${long ? ` vs ${CMP[S.cmp][0]}` : ""}</span>`;
}
function vsCmpRaw(cur, b) {
  if (cur == null) return "";
  const d = Math.round((cur - b) * 10) / 10 || 0;   // round first: no "-0.0"
  return `<span class="num dlt ${d > 0 ? "pos" : d < 0 ? "neg" : ""}">${d > 0 ? "+" : ""}${d.toFixed(1)}</span>`;
}
// combine baseline records (statewide = all CDs), weighting each share by its vote column
function rollRecs(recs) {
  const out = [];
  Object.values(CMP).forEach(([, s, w]) => {
    let n = 0, d = 0;
    recs.forEach(r => { if (r[s] != null && r[w]) { n += r[s] * r[w]; d += r[w]; } });
    out[s] = d ? n / d : null; out[w] = d;
  });
  return out;
}
function cdLocs(c) {
  // stable order all night: largest expected vote (NCEC) first, scaled to the share of precincts in this CD
  const ev = l => (l.ncec_expvote || 0) * (l.contests[c.id]?.part || 0) / (l.precincts_part || 1);
  return c.localities.map(f => D.locByFips[f]).filter(Boolean).sort((a, b) => ev(b) - ev(a));
}

// Race rc's votes in locality l, limited to CD cdc. Whole-locality numbers unless l is split across CDs;
// then it sums that CD's precincts, and any precinct in two CDs (incl. the central absentee one) is divided by House votes.
// Returns null while a split locality's precinct file is loading.
function areaVotes(rc, cdc, l) {
  const lc = l.contests[rc.id];
  if (!lc) return null;
  if (rc === cdc || !D.splits.has(l.fips)) return lc;
  const pf = S.precData[l.fips];
  if (!pf || pf.failed) return null;
  const v = rc.options.map(() => 0);
  let part = 0, rep = 0;
  for (const p of pf.precincts) {
    const pc = p.contests[rc.id];
    if (!pc || !p.contests[cdc.id]) continue;
    // a precinct covering more than one CD (8 real splits, plus each CAP): this CD's share of its House votes
    const cds = Object.keys(p.contests).filter(id => D.byId[id]?.scope === "Congressional");
    let share = 1;
    if (cds.length > 1) {
      const tot = sum(cds.map(id => sum(p.contests[id].v)));
      share = tot ? sum(p.contests[cdc.id].v) / tot : 1 / cds.length;
    }
    if (!p.virtual) { part++; if (p.status !== "Not Reported") rep++; }
    pc.v.forEach((x, i) => v[i] += x * share);
  }
  const vr = v.map(Math.round);
  return { v: vr, part, rep, total: sum(vr) };
}
function cdRace(rc, cdc) {
  if (rc === cdc) return { v: cdc.options.map(o => o.votes), part: cdc.precincts_part, rep: cdc.precincts_rep, total: cdc.total };
  const parts = cdc.localities.map(f => D.locByFips[f]).filter(Boolean).map(l => areaVotes(rc, cdc, l));
  if (parts.some(p => !p)) return null;
  const v = rc.options.map((o, i) => sum(parts.map(p => p.v[i])));
  return { v, part: sum(parts.map(p => p.part)), rep: sum(parts.map(p => p.rep)), total: sum(v) };
}

function crumbBar(oc, ol) {
  const T = tree();
  const trail = [`<button data-crumb="root">${T.root()}</button>`];
  if (oc) trail.push(`<button data-crumb="cd">CD ${oc.district}</button>`);
  if (ol) trail.push(`<button data-crumb="loc">${esc(title(ol.name))}</button>`);
  return `<div id="crumb"><nav class="trail" aria-label="Drill-down path">${trail.join(`<span class="sep" aria-hidden="true">›</span>`)}</nav>
      <div class="ctl"><div class="seg" role="group" aria-label="Districts shown">
        <button data-scope="targets" aria-pressed="${S.targetsOnly}">Targets <span class="num">${TARGETS.join(" · ")}</span></button>
        <button data-scope="all" aria-pressed="${!S.targetsOnly}">All 11</button></div>
      </div>
      <div class="cmpbar"><span class="l" aria-hidden="true"><span class="lg">Compare to</span><span class="sm">vs</span></span>
        <div class="cmpseg" role="group" aria-label="Compare Dem share to">${Object.entries(CMP).map(([k, [lab, , , sh, yr]]) =>
          `<button data-cmp="${k}" aria-pressed="${k === S.cmp}" aria-label="${esc(lab)}"><span class="lg">${esc(lab)}</span><span class="sm"><b>${sh}</b><small>${yr}</small></span></button>`).join("")}</div></div></div>`;
}
function treeList() {
  const st = tree().st();
  const all = D.contests.filter(c => c.scope === "Congressional").sort((a, b) => a.district - b.district);
  const oc = all.find(c => c.district === st.cd);
  const ol = oc && st.fips ? D.locByFips[st.fips] : null;
  const cds = S.targetsOnly ? all.filter(c => TARGETS.includes(c.district) || c === oc) : all;
  return { oc, ol, html: `<ul class="tree">${cds.map(cdNode).join("")}</ul>` };
}
const CMP_NOTE = `D % is the Democrat's share of the two-party (D + R) vote. The ± compares it with the same precincts in the chosen election:
      Baseline is the expected 2026 Dem share from recent elections (NCEC), Spanberger '25 is the 2025 governor's race, Harris '24 the 2024 presidential race,
      and House '24 / House '22 the U.S. House race in the same district (same lines as 2026).
      Until a locality's absentee ballots are counted, its returns are mostly Election Day votes and will run behind the comparison.
      Est. D / R not counted applies each locality's absentee party mix to its uncounted ballots.`;

function renderCongress() {
  const t = treeList();
  $("#view").innerHTML = `${crumbBar(t.oc, t.ol)}${t.html}
    <p class="note">Tap a district for its localities, then a locality for its precincts. Localities are ordered by expected vote.
      Split localities show only their precincts in that district, and absentee counts only voters assigned to it. ${CMP_NOTE}</p>`;
}

/* ── Senate tab: U.S. Senate summary, then the CD › locality › precinct tree ── */
function renderSenate() {
  const sen = D.byId.cc142, s = D.summary;
  // Senate-by-CD needs the split localities' precinct files; draw now, redraw when they land
  const missing = [...D.splits].filter(f => !S.precData[f]);
  if (missing.length) Promise.all(missing.map(loadPrec)).then(() => { if (S.tab === "senate") renderSenate(); });
  const sv = sen.options.map(o => o.votes), dm = dem2(sen, sv);
  const rec = BASE?.cdt ? rollRecs(Object.values(BASE.cdt)) : null;
  const t = treeList();
  $("#view").innerHTML = `${crumbBar(t.oc, t.ol)}
    <div class="cdn open"><div class="nb sen-top">
      <div><h3 style="margin:0;font-size:17px">U.S. Senate</h3><div class="sub" style="font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap">${reportingSub(sen.precincts_part, sen.precincts_rep)}<span>${matchup(sen)}</span></div></div>
      ${resultRows(sen, sv, { hideZeroWriteIn: true })}${marginLine(sen, sv)}
      <div class="kv">
        <div><div class="l">Votes</div><div class="v num">${fmt(sen.total)}</div></div>

// one slim scale: tonight's two-party D % (labeled above), the selected comparison (labeled below),
// the other comparisons as unlabeled dots, and a 50% mark
function yardstick(dm, rec) {
  if (!rec) return "";
  const pts = Object.entries(CMP).map(([k, [lab, i]]) => ({ k, lab, v: rec[i] })).filter(p => p.v != null);
  const vals = pts.map(p => p.v).concat(dm != null ? [dm] : [], [50]);
  const lo = Math.floor(Math.min(...vals) - 1), hi = Math.ceil(Math.max(...vals) + 1);
  const pos = v => (v - lo) / (hi - lo) * 100;
  const edge = v => pos(v) < 15 ? " al" : pos(v) > 85 ? " ar" : "";   // keep labels inside near the ends
  const on = pts.find(p => p.k === S.cmp);
  return `<div class="yard" role="img" aria-label="Tonight ${dm != null ? fp(dm) : "not reported"}${on ? `, ${esc(on.lab)} ${fp(on.v)}` : ""} (Democratic share of two-party vote)">
    <div class="ytrack" title="50% = even"><i class="fifty" style="left:${pos(50).toFixed(2)}%"></i>
      ${pts.filter(p => p !== on).map(p => `<i class="tk" style="left:${pos(p.v).toFixed(2)}%" title="${esc(p.lab)} ${fp(p.v)}"></i>`).join("")}
      ${on ? `<i class="tk on${edge(on.v)}" style="left:${pos(on.v).toFixed(2)}%" data-l="${esc(on.lab)} ${fp(on.v)}"></i>` : ""}
      ${dm != null ? `<i class="now${edge(dm)}" style="left:${pos(dm).toFixed(2)}%" data-l="Tonight ${fp(dm)}"></i>` : ""}</div></div>`;
}

function locNode(cdc, l) {

function treeClick(e) {
  const T = tree(), o = T.st(), tab = S.tab;
  const scrollTo = (id, always) => {
    const el = $("#" + id); if (!el) return;
    el.focus({ preventScroll: true });
    if (always || el.getBoundingClientRect().top < (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--top-h")) || 0) + 52)
      el.scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  };
  const b = e.target.closest("[data-cd], [data-loc], [data-crumb], [data-scope], [data-cmp]");
  if (!b) return false;
  if (b.dataset.cmp) {
    S.cmp = b.dataset.cmp;
    try { localStorage.setItem("enr.cmp", S.cmp); } catch (_) {}
    redraw(); return true;
  }
  if (b.dataset.scope) {
    S.targetsOnly = b.dataset.scope === "targets";
    try { localStorage.setItem("enr.targets", S.targetsOnly ? "1" : "0"); } catch (_) {}
    redraw(); return true;
  }
  if (b.dataset.crumb) {
    const k = b.dataset.crumb;
    if (k === "root") { o.cd = null; o.fips = null; setHash(); redraw(); window.scrollTo({ top: 0 }); }
    else if (k === "cd") { o.fips = null; setHash(); redraw(); scrollTo(`${T.pre}-cd${o.cd}`, true); }
    else scrollTo(`${T.pre}-${o.cd}-${o.fips}`, true);
    return true;
  }
  if (b.dataset.cd) {
    const cd = +b.dataset.cd, opening = o.cd !== cd;
    o.cd = opening ? cd : null; o.fips = null;
    setHash(); redraw(); scrollTo(`${T.pre}-cd${cd}`, opening);
    return true;
  }
  const fips = b.dataset.loc, opening = o.fips !== fips;
  o.fips = opening ? fips : null;
  setHash(); redraw(); scrollTo(`${T.pre}-${o.cd}-${fips}`, opening);
  if (opening && !S.precData[fips]) loadPrec(fips).then(() => { if (S.tab === tab && o.fips === fips) { redraw(); $(`#${T.pre}-${o.cd}-${fips}`)?.focus({ preventScroll: true }); } });
  return true;
}
function methodTable(c, perOpt) {
  // perOpt[i] = votes by GROUPS order for option i
  const used = GROUPS.map((g, gi) => gi).filter(gi => perOpt.some(r => r[gi]));
  if (!used.length) return `<p class="note">No votes reported yet.</p>`;
  const opts = c.options.map((o, i) => i).filter(i => sum(perOpt[i]) > 0);
  return `<div class="tbl-wrap" style="margin-top:10px"><table class="static"><thead><tr><th>Candidate</th>${used.map(gi => `<th>${GROUPS[gi][1]}</th>`).join("")}<th>Total</th></tr></thead><tbody>` +
    opts.map(i => `<tr><td><span class="tag" style="background:${pcolor(c.options[i])};color:#fff">${esc(c.type === "BallotMeasure" ? c.options[i].name : shortName(c.options[i].name))}</span></td>${used.map(gi => `<td class="num">${fmt(perOpt[i][gi])}</td>`).join("")}<td class="num"><b>${fmt(sum(perOpt[i]))}</b></td></tr>`).join("") +
    `</tbody></table></div>`;
}

          return `<tr${p.virtual ? ' class="cap"' : ""}><td>${p.virtual ? `Central absentee precinct <span class="tag" style="background:rgba(240,165,0,.18);color:var(--amber)">CAP</span>` : esc(p.display_name)}</td>
            <td><span class="chip ${done ? "st-final" : "st-not-reported"}">${done ? "In" : "Not in"}</span></td>
            ${top.map(i => `<td class="num${i === lead ? " lead" : ""}" ${i === lead ? `style="color:${pcolor(cur.options[i])}"` : ""}>${t ? (pc.v[i] / t * 100).toFixed(1) + "%" : "—"}</td>`).join("")}
            <td class="num">${fmt(t)}</td><td class="num">${p.virtual ? "—" : fp(p.turnout_pct)}</td></tr>`;
        }).join("")}</tbody></table></div>
        <p class="note">Under SBE Policy 2023-001 and ELECT Policy 2025-002, absentee results go into a central absentee precinct (CAP) on election night. Absentee and provisional results must be reported by precinct by 5 PM on the tenth day after a general election (Nov 13, 2026).</p></section>`;
    $("#d-contest").onchange = e => { cur = D.byId[e.target.value]; draw(); };
  };
  draw();
}
function closeDrawer() { $("#scrim").hidden = true; $("#drawer").hidden = true; }
$("#d-close").onclick = closeDrawer;
$("#scrim").onclick = closeDrawer;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

/* ── Wiring ───────────────────────────────────────────── */
function bindSearch(sel, key, redraw) {
  const el = $(sel);
  el.oninput = () => { S.q[key] = el.value; redraw(); };
}
document.addEventListener("click", e => {
  if ((S.tab === "congress" || S.tab === "senate") && D && treeClick(e)) return;
  const th = e.target.closest("table:not(.static) th[data-k]");
  if (th) {
    const key = th.closest("table").dataset.key, k = th.dataset.k;
    const cur = S.sort[key] || { k: "tot", d: -1 };
    S.sort[key] = { k, d: cur.k === k ? -cur.d : (k === "name" || k === "lead" || k === "st" ? 1 : -1) };
    render(); return;
  }
  const tr = e.target.closest("table:not(.static):not(.nolink) tbody tr[data-fips]");
  if (tr) { openLocality(tr.dataset.fips, tr.closest("table").dataset.cid); return; }
  const ob = e.target.closest("[data-open]");
  if (ob) openLocality(ob.dataset.open, ob.dataset.cid);
});
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; setHash(); render(); });

// #cd2 = CD 2 open, #cd2/550 = CD 2 › Chesapeake open; #senate/cd2/550 = same in the Senate tree (shareable)
function setHash() {
  const path = o => o.cd ? `cd${o.cd}${o.fips ? "/" + o.fips : ""}` : "";
  const h = S.tab === "congress" ? path(S.open) || "congress"
          : S.tab === "senate" ? "senate" + (S.sopen.cd ? "/" + path(S.sopen) : "") : S.tab;
  try { history.replaceState(null, "", "#" + h); } catch (_) {}
}
function readHash() {
  const h = location.hash.slice(1);
  const m = h.match(/^((?:senate|statewide)\/)?cd(\d{1,2})(?:\/(\d{3}))?$/);   // statewide = pre-split name
  if (m) {
    S.tab = m[1] ? "senate" : "congress";
    S[m[1] ? "sopen" : "open"] = { cd: +m[2], fips: m[3] || null };
    if (!TARGETS.includes(+m[2])) S.targetsOnly = false;
  }
  else if (h === "statewide") S.tab = "senate";
  else if (["senate", "amendments", "congress", "local"].includes(h)) S.tab = h;
}
// sticky offset for #crumb: header height on desktop, 0 on phones where #top scrolls away
function measureTop() {
  const t = $("#top");
  document.documentElement.style.setProperty("--top-h", (getComputedStyle(t).position === "sticky" ? t.offsetHeight : 0) + "px");
}
if (window.ResizeObserver) new ResizeObserver(measureTop).observe($("#top"));
addEventListener("resize", measureTop);
function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === S.tab));
  renderStrip();
  ({ senate: renderSenate, amendments: renderAmendments, congress: renderCongress, local: renderLocal })[S.tab]();
}

let left = REFRESH_S;
async function tick() {
  left -= 1;
  if (left <= 0) {
    left = REFRESH_S;
    try {
      const active = document.activeElement?.id;
      await load(); render();
      if (active && $("#" + active)) $("#" + active).focus({ preventScroll: true });
    } catch (err) { console.warn("refresh failed", err); }
  }
  $("#m-cd").textContent = left;
}

(async function start() {
  readHash();
  try { await load(); render(); }
  catch (err) { $("#view").innerHTML = `<div class="empty">Results data could not be loaded (${esc(err.message)}). The page will retry in ${REFRESH_S} seconds.</div>`; }
  setInterval(tick, 1000);
})();
</script>
